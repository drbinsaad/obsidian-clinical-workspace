name: Release

on:
  push:
    # Obsidian release tags are bare semantic versions with no 'v' prefix.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

# Default to read-only; the single job that publishes elevates for itself.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify release artefacts
        run: npm run verify-release

      - name: Verify Community review readiness
        run: npm run verify-community

      - name: Assert the tag matches the manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          MANIFEST="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag $TAG does not match manifest version $MANIFEST."
            exit 1
          fi
          echo "Tag $TAG matches the manifest."

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          # Copied by explicit name. Never a glob over dist/, so a stray file
          # in the build directory can never be published by accident.
          cp dist/main.js release/main.js
          cp dist/manifest.json release/manifest.json
          cp dist/styles.css release/styles.css
          ls -l release

      - name: Upload artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin
          path: release/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    # The only place in this repository that can write. Scoped to this job.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin
          path: release

      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          # Obsidian and BRAT expect these three files, named exactly this way.
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
